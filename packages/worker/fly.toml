app = "vendor-observatory-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-2x"
  memory = "8gb"

[env]
  NODE_ENV = "production"

# Secrets (set via fly secrets set):
# DATABASE_URL=postgresql://...
# ANTHROPIC_API_KEY=...
# OPENAI_API_KEY=...

# This is a Databricks asset bundle definition for benchmark.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: benchmark
  uuid: 562bf03b-f370-4e24-8571-c122d62713be

include:
  - resources/*.yml
  - resources/*/*.yml

sync:
  include:
    - dist/*.whl

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL warehouse ID for dashboards

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-11cd9b20-43da.cloud.databricks.com
    variables:
      catalog: benchmarks
      schema: dev
      warehouse_id: dd7165b90dbdd269
  prod:
    mode: production
    workspace:
      host: https://dbc-11cd9b20-43da.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/talcorn.92@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/talcorn.92@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: benchmarks
      schema: prod
      warehouse_id: dd7165b90dbdd269
    permissions:
      - user_name: talcorn.92@gmail.com
        level: CAN_MANAGE

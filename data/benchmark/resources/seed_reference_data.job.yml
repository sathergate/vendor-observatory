resources:
  jobs:
    seed_reference_data:
      name: seed_reference_data
      description: "Seed vendor taxonomy, package map, and prompts into Delta tables"
      tasks:
        - task_key: seed
          spark_python_task:
            python_file: ../src/benchmark/jobs/seed_reference_data.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.file_path}/dist/benchmark-0.0.1-py3-none-any.whl
              - pyyaml

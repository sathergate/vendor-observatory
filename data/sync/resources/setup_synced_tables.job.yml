resources:
  jobs:
    setup_synced_tables:
      name: setup_synced_tables
      description: "One-off: create synced table definitions to replicate adapter tables into Lakebase Postgres"
      tasks:
        - task_key: setup
          spark_python_task:
            python_file: ../src/sync/jobs/setup_synced.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.file_path}/dist/sync-0.0.1-py3-none-any.whl
              - databricks-sdk>=0.60

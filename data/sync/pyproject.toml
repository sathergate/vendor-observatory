[project]
name = "sync"
version = "0.0.1"
authors = [{ name = "talcorn.92@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-connect>=15.4,<15.5",
    "databricks-sdk",
]

[project.scripts]
main = "sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

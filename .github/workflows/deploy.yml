name: Verify Deployment

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Wait for Vercel's native GitHub integration to deploy
    steps:
      - name: Wait for Vercel deployment
        run: sleep 120

      - name: Verify health endpoint
        run: |
          STATUS=$(curl -sf https://vendor-observatory.vercel.app/api/health | jq -r '.ok')
          if [ "$STATUS" = "true" ]; then
            echo "✅ Deployment verified — health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Verify data endpoint
        run: |
          COUNT=$(curl -sf https://vendor-observatory.vercel.app/api/vendors | jq '.length')
          echo "✅ Vendors endpoint returned $COUNT vendors"

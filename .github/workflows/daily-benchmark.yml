name: Daily Benchmark

on:
  schedule:
    # 12:00 UTC = 5:00 AM PDT / 4:00 AM PST
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Daily budget cap in USD"
        required: false
        default: "25"
      assistants:
        description: "Comma-separated assistant list"
        required: false
        default: "claude_code,codex_cli,cursor"
      category:
        description: "Only run prompts from this category (blank = all)"
        required: false
        default: ""

# Prevent concurrent benchmark runs from overlapping
concurrency:
  group: daily-benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # ── Node.js + pnpm ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # ── Install + build ─────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      # ── Install AI assistant CLIs ───────────────────────────────
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install Cursor CLI (optional)
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/cursor-cli 2>/dev/null \
            || npm install -g cursor-cli 2>/dev/null \
            || echo "::warning::Cursor CLI not available — will be skipped"

      - name: Authenticate Codex CLI
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Verify CLI availability
        run: |
          echo "=== CLI availability ==="
          which claude && claude --version || echo "claude: NOT FOUND"
          which codex && codex --version || echo "codex: NOT FOUND"
          which cursor && cursor --version || echo "cursor: NOT FOUND (optional)"

      # ── Git identity ────────────────────────────────────────────
      - name: Configure git identity
        run: |
          git config user.name "James Alcorn"
          git config user.email "jhm.alcorn@gmail.com"

      # ── Run benchmark ───────────────────────────────────────────
      - name: Run benchmark suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
        run: |
          BUDGET="${{ github.event.inputs.budget || '25' }}"
          ASSISTANTS="${{ github.event.inputs.assistants || 'claude_code,codex_cli,cursor' }}"
          CATEGORY="${{ github.event.inputs.category || '' }}"

          ARGS="run --budget $BUDGET --assistants $ASSISTANTS"
          if [ -n "$CATEGORY" ]; then
            ARGS="$ARGS --category $CATEGORY"
          fi

          echo "Running: node packages/benchmark/dist/index.js $ARGS"
          node packages/benchmark/dist/index.js $ARGS || echo "::warning::Benchmark had errors (continuing to ingest...)"

      # ── Checkpoint: save raw transcripts before ingest ──────────
      - name: Upload raw transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_number }}
          path: |
            /home/runner/.claude/projects/-tmp-obs-bench*/**/*.jsonl
            /home/runner/.codex/sessions/**/*.jsonl
            /home/runner/.cursor-obs/sessions/**/*.jsonl
            db/bench-cost.jsonl
          retention-days: 14
          if-no-files-found: warn

      # ── Ingest ──────────────────────────────────────────────────
      - name: Wait for transcript flush
        run: sleep 5

      - name: Ingest transcripts
        continue-on-error: true
        run: node packages/ingest/dist/index.js ingest

      # ── Post-benchmark analysis ───────────────────────────────
      - name: Post-benchmark analysis
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running cross-session analysis..."
          node packages/ingest/dist/index.js analyze --type all || echo "::warning::Analysis had errors"
          echo "Generating daily digest..."
          node packages/ingest/dist/index.js digest || echo "::warning::Digest generation had errors"

      # ── Commit + push ──────────────────────────────────────────
      - name: Commit and push if DB changed
        run: |
          if git diff --quiet -- db/observatory.sqlite 2>/dev/null; then
            echo "No changes to observatory.sqlite — skipping push."
            exit 0
          fi

          echo "DB changed — committing and pushing..."

          # Stash our DB, pull latest main, then re-apply our DB on top.
          # This avoids rebase conflicts on the binary sqlite file.
          cp db/observatory.sqlite /tmp/observatory.sqlite.new
          git checkout -- db/observatory.sqlite
          git pull origin main
          cp /tmp/observatory.sqlite.new db/observatory.sqlite

          git add db/observatory.sqlite
          git commit -m "chore: daily observatory data refresh

          Automated benchmark + transcript ingest via GitHub Actions."
          git push origin main

      # ── Final artifacts: DB + cost log ─────────────────────────
      - name: Upload database and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            db/observatory.sqlite
            db/bench-cost.jsonl
          retention-days: 30

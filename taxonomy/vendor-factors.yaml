# Vendor Factor Scores
# Scores each vendor across the 10 AI-recommendation factors from vendor-selection-principles.md.
# Scores: 1 (poor) → 5 (excellent). null = not assessed.
# Confidence: high = explicitly discussed in principles doc, medium = partially referenced, low = inferred.

---
version: "1.0"
description: >
  Vendor scores across the 10 AI-recommendation factors.
  Used by the Factor Analysis visualization in the web dashboard.

factors:
  - id: training_data_volume
    label: Training Data Volume
    short: Training Data
    weight: very_high
    description: GitHub repos, tutorials, SO answers using this tool

  - id: integration_speed
    label: Integration Speed
    short: Integration
    weight: very_high
    description: Lines of code to first working integration

  - id: serverless_compat
    label: Serverless Compatibility
    short: Serverless
    weight: high
    description: HTTP-based, edge support, connection pooling

  - id: free_tier
    label: Free Tier Generosity
    short: Free Tier
    weight: high
    description: Limits, pausing behavior, real product vs demo

  - id: docs_quality
    label: Documentation Quality
    short: Docs
    weight: high
    description: Copy-pasteable examples, TS types, error messages

  - id: stack_fit
    label: Stack Fit
    short: Stack Fit
    weight: high
    description: Next.js App Router, React components, RSC compat

  - id: reliability
    label: Reliability & Trust
    short: Reliability
    weight: medium_high
    description: Breaking changes, maintenance, pricing stability

  - id: security_defaults
    label: Security Defaults
    short: Security
    weight: medium_high
    description: CSRF, parameterized queries, scoped keys

  - id: cost_predictability
    label: Cost Predictability
    short: Cost
    weight: medium
    description: Pricing model, surprise charges, self-host breakpoint

  - id: escape_hatch
    label: Escape Hatch
    short: Lock-in
    weight: medium
    description: Standard tech, open-source option, migration ease

